name: Sync verified live Breviars.lv files
on:
  push:
    paths:
      - '.github/workflows/audit-live.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download and verify live text resources
        shell: bash
        env:
          LIVE_FILES: 'css/style.css index.html js/app-loader.js js/calendar.js js/festum.js js/gavenis.js js/himnas.js js/komplet.js js/lieldienas.js js/liturgiskaisgads.js js/lugsana_pll_sv.js js/officium.js js/parastais.js js/pieminasdienas.js js/psalmi.js js/pwa-controller.js js/template_liturgy.js js/tools.js js/version.js js/ziemassvetki.js service-worker.js'
        run: |
          python3 - <<'PY'
          import os, pathlib, urllib.parse, urllib.request, hashlib
          paths=os.environ['LIVE_FILES'].split()
          downloads={}
          for path in paths:
              url='https://breviars.lv/'+urllib.parse.quote(path,safe='/')
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Breviars GitHub synchronization)','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  if response.status!=200: raise RuntimeError(f'{path}: HTTP {response.status}')
                  mime=response.headers.get('Content-Type','').lower()
                  data=response.read(5000001)
              if not data or len(data)>5000000: raise RuntimeError(f'{path}: invalid length {len(data)}')
              if 'text/html' in mime and not path.endswith('.html'): raise RuntimeError(f'{path}: unexpected HTML MIME {mime}')
              if not path.endswith('.html') and data.lstrip().lower().startswith(b'<!doctype html'): raise RuntimeError(f'{path}: unexpected HTML content')
              data.decode('utf-8')
              downloads[path]=data
              print('VERIFIED',path,'bytes',len(data),'sha256',hashlib.sha256(data).hexdigest()[:16],flush=True)
          for path,data in downloads.items():
              pathlib.Path(path).write_bytes(data)
          print('ALL_DOWNLOADED',len(downloads),flush=True)
          PY
      - name: Commit verified files from the live website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- css/style.css index.html js/app-loader.js js/calendar.js js/festum.js js/gavenis.js js/himnas.js js/komplet.js js/lieldienas.js js/liturgiskaisgads.js js/lugsana_pll_sv.js js/officium.js js/parastais.js js/pieminasdienas.js js/psalmi.js js/pwa-controller.js js/template_liturgy.js js/tools.js js/version.js js/ziemassvetki.js service-worker.js
          if git diff --cached --quiet; then
            echo 'Already matches live files'
          else
            git diff --cached --stat
            git commit -m "Sync verified text assets from breviars.lv production"
            git push origin HEAD:main
          fi
